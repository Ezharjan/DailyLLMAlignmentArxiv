# LLM / VLM Alignment Arxiv Daily Tracker
# Automatically fetches latest papers in AI Alignment, LLM Safety, and related domains
base_url: "https://arxiv.paperswithcode.com/api/v0/papers/"
user_name: "Ezharjan"
repo_name: "DailyLLMAlignmentArxiv"
show_authors: True
show_links: True
show_badge: True
max_results: 15

publish_readme: False
publish_gitpage: True

# file paths
json_readme_path: './docs/alignment-arxiv-daily.json'
json_gitpage_path: './docs/alignment-arxiv-daily-web.json'

md_readme_path: 'README.md'
md_gitpage_path: './docs/index.md'

# Keywords covering AI Alignment, LLM Safety, Deception, Collusion, Coherence, and related domains
# Aligned with arxiv categories: cs.AI, cs.LG, cs.CL, cs.CY, etc.
keywords:
    "Deception in LLMs": 
        filters: ["LLM Deception", "Language Model Deception", 
                  "AI Deception", "Misleading LLMs", 
                  "Deceptive AI", "LLM Manipulation",
                  "AI Safety Deception", "Alignment Deception"]
    
    "Collusion in LLMs":
        filters: ["LLM Collusion", "AI Collusion", "Model Collusion",
                  "Collaborative AI", "LLM Cooperation", "Alignment Collusion",
                  "Multi-Agent Collusion", "AI Teamwork"]
    
    "Coherence in LLMs":
        filters: ["LLM Coherence", "Language Model Coherence",
                  "AI Coherence", "Self-Improvement Coherence", "Alignment Coherence",
                  "Coherent AI", "Consistency in LLMs"]
    
    "Reward Hacking":
        filters: ["Reward Hacking", "Reward Tampering", "Alignment Reward Hacking",
                  "Spontaneous Reward Hacking", "Iterative Self-Refinement Hacking",
                  "AI Reward Manipulation", "Safety Reward Hacking"]
    
    "AI Alignment Techniques":
        filters: ["AI Alignment", "LLM Alignment", "Value Alignment",
                  "Human-AI Alignment", "Alignment Methods", "Safety Alignment",
                  "Constitutional AI", "Alignment Training"]
    
    "Unsupervised Elicitation":
        filters: ["Unsupervised Elicitation", "LLM Elicitation", "AI Elicitation",
                  "Unsupervised Learning Alignment", "Elicitation Techniques",
                  "AI Capability Elicitation", "Alignment Elicitation"]
    
    "Self-Improvement in AI":
        filters: ["AI Self-Improvement", "LLM Self-Improvement", "Recursive Improvement",
                  "Iterative Refinement", "Self-Enhancing AI", "Alignment Self-Improvement",
                  "Coherence Optimization", "AI Evolution"]
    
    "VLM Alignment":
        filters: ["Vision-Language Model Alignment", "VLM Alignment", "Multimodal Alignment",
                  "Vision-Language Safety", "Multimodal AI Alignment", "VLM Safety",
                  "Visual AI Alignment", "Image-Text Alignment"]
    
    "AI Safety Mechanisms":
        filters: ["AI Safety", "LLM Safety", "Alignment Safety", "Safe AI",
                  "AI Risk Mitigation", "Safety Training", "Robust Alignment",
                  "AI Governance", "Safety Protocols"]
    
    "Adversarial Attacks on Alignment":
        filters: ["Adversarial Alignment", "Alignment Attacks", "Jailbreaking LLMs",
                  "Prompt Injection", "Alignment Vulnerabilities", "AI Adversarial",
                  "Safety Attacks", "Alignment Robustness"]
    
    "Scalable Oversight":
        filters: ["Scalable Oversight", "AI Oversight", "Alignment Oversight",
                  "Supervision Techniques", "Oversight Methods", "Human Oversight",
                  "AI Monitoring", "Alignment Verification"]
    
    "Constitutional AI":
        filters: ["Constitutional AI", "AI Constitution", "Self-Constitutional",
                  "Alignment Constitution", "Rule-Based Alignment", "AI Ethics",
                  "Constitutional Learning", "Principled AI"]
